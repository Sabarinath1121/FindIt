apiVersion: apps/v1
kind: Deployment
metadata:
  name: findit-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: findit
  template:
    metadata:
      labels:
        app: findit
    spec:
      containers:
        - name: findit-container
          image: findit:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
